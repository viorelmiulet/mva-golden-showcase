    <g font-family="'Cinzel','Playfair Display',Georgia,serif" font-weight="700" font-size="72" text-anchor="middle" letter-spacing="2">
      <text x="80" y="103" fill="url(#wallGold)">M</text>
      <text x="150" y="103" fill="url(#wallSilver)">V</text>
      <text x="220" y="103" fill="url(#wallGold)">A</text>
    </g>
    <g stroke="url(#wallGold)" stroke-width="1.4" fill="none">
      <rect x="213" y="82" width="14" height="12"/>
      <line x1="220" y1="82" x2="220" y2="94"/>
      <line x1="213" y1="88" x2="227" y2="88"/>
    </g>
  </g>
  <text x="600" y="560" text-anchor="middle" font-family="'Cinzel','Playfair Display',Georgia,serif" font-size="34" letter-spacing="8" fill="url(#wallGold)">IMOBILIARE</text>
