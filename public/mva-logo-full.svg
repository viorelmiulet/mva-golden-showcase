<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" role="img" aria-label="MVA Imobiliare">
  <defs>
    <linearGradient id="fGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE7A0"/>
      <stop offset=".5" stop-color="#DAA520"/>
      <stop offset="1" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="fSilver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2F2F2"/>
      <stop offset=".5" stop-color="#BFBFBF"/>
      <stop offset="1" stop-color="#8A8A8A"/>
    </linearGradient>
  </defs>

  <!-- Building silhouettes (alternating gold/silver) -->
  <g>
    <rect x="120" y="40"  width="30" height="60" fill="url(#fGold)"/>
    <rect x="155" y="20"  width="30" height="80" fill="url(#fSilver)"/>
    <rect x="190" y="35"  width="30" height="65" fill="url(#fGold)"/>
    <rect x="225" y="55"  width="30" height="45" fill="url(#fSilver)"/>
    <!-- window slits -->
    <g fill="#0a0a0f" opacity=".85">
      <rect x="128" y="52"  width="4" height="6"/>
      <rect x="128" y="66"  width="4" height="6"/>
      <rect x="138" y="52"  width="4" height="6"/>
      <rect x="138" y="66"  width="4" height="6"/>
      <rect x="163" y="34"  width="4" height="6"/>
      <rect x="163" y="48"  width="4" height="6"/>
      <rect x="163" y="62"  width="4" height="6"/>
      <rect x="173" y="34"  width="4" height="6"/>
      <rect x="173" y="48"  width="4" height="6"/>
      <rect x="173" y="62"  width="4" height="6"/>
      <rect x="198" y="48"  width="4" height="6"/>
      <rect x="198" y="62"  width="4" height="6"/>
      <rect x="208" y="48"  width="4" height="6"/>
      <rect x="208" y="62"  width="4" height="6"/>
      <rect x="233" y="68"  width="4" height="6"/>
      <rect x="243" y="68"  width="4" height="6"/>
    </g>
  </g>

  <!-- Chimney -->
  <rect x="256" y="140" width="14" height="30" fill="url(#fGold)"/>
  <!-- Roof -->
  <path d="M60 190 L200 110 L340 190" fill="none" stroke="url(#fGold)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- MVA letters -->
  <g font-family="'Cinzel','Playfair Display',Georgia,serif" font-weight="700" font-size="120" text-anchor="middle" letter-spacing="4">
    <text x="105" y="330" fill="url(#fGold)">M</text>
    <text x="200" y="330" fill="url(#fSilver)">V</text>
    <text x="295" y="330" fill="url(#fGold)">A</text>
  </g>
  <!-- 4-pane window in A counter -->
  <g stroke="url(#fGold)" stroke-width="2" fill="none">
    <rect x="284" y="298" width="22" height="18"/>
    <line x1="295" y1="298" x2="295" y2="316"/>
    <line x1="284" y1="307" x2="306" y2="307"/>
  </g>

  <!-- Thin gold divider -->
  <line x1="80" y1="380" x2="320" y2="380" stroke="url(#fGold)" stroke-width="1.5"/>

  <!-- IMOBILIARE wide-tracked silver -->
  <text x="200" y="420" font-family="'Cinzel','Playfair Display',Georgia,sans-serif" font-weight="500" font-size="32" text-anchor="middle" letter-spacing="14" fill="url(#fSilver)">IMOBILIARE</text>
</svg>
