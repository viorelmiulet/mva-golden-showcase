<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 110" role="img" aria-label="MVA Imobiliare">
  <defs>
    <linearGradient id="mvaGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE7A0"/>
      <stop offset=".5" stop-color="#DAA520"/>
      <stop offset="1" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="mvaSilver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0F0F0"/>
      <stop offset=".5" stop-color="#BFBFBF"/>
      <stop offset="1" stop-color="#8A8A8A"/>
    </linearGradient>
  </defs>
  <!-- Chimney on right slope -->
  <rect x="196" y="30" width="11" height="24" fill="url(#mvaGold)"/>
  <!-- Roof line: two angled strokes meeting at peak -->
  <path d="M40 66 L150 12 L260 66" fill="none" stroke="url(#mvaGold)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- MVA letters (M and A gold, V silver) -->
  <g font-family="'Cinzel','Playfair Display',Georgia,serif" font-weight="700" font-size="72" text-anchor="middle" letter-spacing="2">
    <text x="80" y="103" fill="url(#mvaGold)">M</text>
    <text x="150" y="103" fill="url(#mvaSilver)">V</text>
    <text x="220" y="103" fill="url(#mvaGold)">A</text>
  </g>
  <!-- 4-pane window accent inside the A counter -->
  <g stroke="url(#mvaGold)" stroke-width="1.4" fill="none">
    <rect x="213" y="82" width="14" height="12"/>
    <line x1="220" y1="82" x2="220" y2="94"/>
    <line x1="213" y1="88" x2="227" y2="88"/>
  </g>
</svg>
