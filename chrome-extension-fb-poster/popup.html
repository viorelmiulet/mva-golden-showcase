<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <title>MVA Facebook Poster</title>
    <style>
      body { width: 340px; margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #1a1a1a; color: #f5f5f5; }
      header { padding: 12px 14px; background: linear-gradient(90deg,#DAA520,#b8860b); color: #1a1a1a; font-weight: 700; }
      main { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
      button { cursor: pointer; padding: 8px 12px; border-radius: 6px; border: 0; font-weight: 600; font-size: 13px; }
      .primary { background: #DAA520; color: #1a1a1a; }
      .secondary { background: #333; color: #f5f5f5; }
      .row { display: flex; gap: 8px; }
      .row > * { flex: 1; }
      a.link { color: #DAA520; text-decoration: none; font-size: 12px; }
      .stats { font-size: 12px; opacity: .85; }
      .log { background: #0f0f0f; border: 1px solid #2a2a2a; border-radius: 6px; height: 180px; overflow: auto; padding: 8px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; white-space: pre-wrap; line-height: 1.35; }
    </style>
  </head>
  <body>
    <header>MVA Facebook Poster</header>
    <main>
      <div class="row">
        <button id="toggleBtn" class="primary">Pornește</button>
        <button id="runBtn" class="secondary">Rulează acum</button>
      </div>
      <a class="link" id="settingsLink" href="#">⚙️ Setări</a>
      <div class="stats" id="stats">Azi: 0/0 postări</div>
      <div class="log" id="log">—</div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
