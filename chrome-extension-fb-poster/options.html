<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <title>Setări MVA Facebook Poster</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width:520px; margin:24px auto; padding:0 16px; background:#1a1a1a; color:#eee; }
    h1 { color:#DAA520; font-size:18px; }
    label { display:block; margin-top:14px; font-size:13px; color:#ccc; }
    input { width:100%; padding:8px 10px; margin-top:4px; background:#111; color:#eee; border:1px solid #333; border-radius:6px; font-size:13px; box-sizing:border-box; }
    button { margin-top:20px; background:#DAA520; color:#000; border:0; border-radius:6px; padding:10px 16px; font-weight:600; cursor:pointer; }
    .note { margin-top:16px; padding:10px 12px; background:#222; border-left:3px solid #DAA520; font-size:12px; color:#ccc; }
    .status { margin-top:12px; font-size:12px; color:#8f8; }
  </style>
</head>
<body>
  <h1>Setări MVA Facebook Poster</h1>

  <label>Edge URL
    <input id="edgeUrl" type="text" placeholder="https://.../functions/v1/fb-queue" />
  </label>

  <label>API Key
    <input id="apiKey" type="password" placeholder="X-Api-Key" />
  </label>

  <label>Delay minim (minute)
    <input id="minDelay" type="number" min="1" />
  </label>

  <label>Delay maxim (minute)
    <input id="maxDelay" type="number" min="1" />
  </label>

  <label>Maxim postări/zi
    <input id="maxPerDay" type="number" min="1" />
  </label>

  <button id="save">Salvează</button>
  <div id="status" class="status"></div>

  <div class="note">
    Grupurile țintă se gestionează din admin, la <strong>/admin/facebook-groups</strong>.
    Extensia primește automat lista prin coada <code>fb-queue</code>.
  </div>

  <script src="options.js"></script>
</body>
</html>
