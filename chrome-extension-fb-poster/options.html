<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <title>Setări — MVA Facebook Poster</title>
    <style>
      body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #1a1a1a; color: #f5f5f5; padding: 24px; max-width: 520px; margin: 0 auto; }
      h1 { color: #DAA520; margin-top: 0; }
      label { display: block; font-size: 13px; margin: 14px 0 4px; font-weight: 600; }
      input, textarea { width: 100%; box-sizing: border-box; padding: 8px 10px; background: #0f0f0f; border: 1px solid #2a2a2a; border-radius: 6px; color: #f5f5f5; font-size: 13px; }
      textarea { min-height: 120px; resize: vertical; line-height: 1.4; }
      .row { display: flex; gap: 12px; }
      .row > div { flex: 1; }
      button { margin-top: 20px; padding: 10px 16px; background: #DAA520; color: #1a1a1a; font-weight: 700; border: 0; border-radius: 6px; cursor: pointer; }
      .note { margin-top: 20px; padding: 12px; background: #0f0f0f; border-left: 3px solid #DAA520; border-radius: 4px; font-size: 12px; opacity: .9; }
      .ok { color: #2ecc71; font-size: 12px; margin-left: 10px; }
    </style>
  </head>
  <body>
    <h1>Setări MVA Facebook Poster</h1>

    <label for="edgeUrl">URL Edge Function (fb-queue)</label>
    <input id="edgeUrl" type="text" placeholder="https://.../functions/v1/fb-queue" />

    <label for="apiKey">API Key (X-Api-Key)</label>
    <input id="apiKey" type="password" placeholder="FB_QUEUE_API_KEY" />

    <label for="groups">URL-uri grupuri Facebook active</label>
    <textarea id="groups" placeholder="https://www.facebook.com/groups/...&#10;https://www.facebook.com/groups/..."></textarea>

    <div class="row">
      <div>
        <label for="minDelay">Delay minim (min)</label>
        <input id="minDelay" type="number" min="1" />
      </div>
      <div>
        <label for="maxDelay">Delay maxim (min)</label>
        <input id="maxDelay" type="number" min="1" />
      </div>
      <div>
        <label for="maxPerDay">Max postări/zi</label>
        <input id="maxPerDay" type="number" min="1" />
      </div>
    </div>

    <button id="saveBtn">Salvează</button>
    <span id="savedMsg" class="ok" style="display:none">✓ Salvat</span>

    <div class="note">
      Copiază aici URL-urile grupurilor active din admin, de la <strong>/admin/facebook-groups</strong>, câte unul pe linie.
    </div>

    <script src="options.js"></script>
  </body>
</html>
